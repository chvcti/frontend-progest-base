name: progest-frontend

on: 
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs: 
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with: 
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type checking
        run: npx vue-tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with: 
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with: 
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        if: github.event_name != 'pull_request'
        with: 
          context: . 
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy: 
    name: Deploy to VM
    needs: build
    runs-on: self-hosted
    if: github.event_name != 'pull_request'
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}:main

    steps: 
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to the Container registry
        run: echo "${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull the new Docker images
        run: docker pull ${{ env.IMAGE_NAME }}

      - name: Tag pulled image as local latest
        run: docker tag ${{ env.IMAGE_NAME }} progest-web:latest || true

      - name: Inject environment variables
        run: |
          if [ -f ~/portal-ti/secrets-prod/.env ]; then
            cp ~/portal-ti/secrets-prod/.env .env
          fi

      - name: Start services with Docker compose
        run: |
          if [ -f "docker-compose.prod.yaml" ]; then
            docker compose -f docker-compose.prod.yaml up -d
          else
            docker compose -f docker-compose.yml up -d
          fi